name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: eas.json profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: eas build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify project is linked
        run: |
          node -e "
          const id = require('./app.json').expo?.extra?.eas?.projectId;
          if (!id || id === 'RUN_eas_init') {
            console.error('Missing real extra.eas.projectId — run: npx eas-cli init --force');
            process.exit(1);
          }
          console.log('EAS projectId', id);
          "

      - name: Build
        run: eas build --non-interactive --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --no-wait
